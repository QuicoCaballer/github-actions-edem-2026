name: Say Hello

on:
  workflow_dispatch:

env:
  VARIABLE_ENV: "mi-aplicacion"

jobs:
  say_hello:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Say Hello
        run: echo "primer job: ${{ env.VARIABLE_ENV }} (Python ${{ matrix.python-version }})"

  say_hello2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Say Hello
        run: echo "segundo job: ${{ env.VARIABLE_ENV }} (Python ${{ matrix.python-version }})"